# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=AlquilerPlayaWeb

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Database Configuration (PostgreSQL - Supabase Session Pooler)
# Uses Session Pooler for IPv4 compatibility (works with Railway)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres.goehhhwusdoduduxntgq}
spring.datasource.password=${DATABASE_PASSWORD:G+M.*2caUwa?SiS}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration for Railway (faster timeouts)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.playa.alquiler=DEBUG
