<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Ingreso Staff - Alquiler Playa')}"></head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-md-8 d-none d-md-block position-relative overflow-hidden">
                <div class="position-absolute w-100 h-100"
                    style="background: url('/img/login-hero.jpg') no-repeat center center; background-size: cover;">
                </div>
                <div class="position-absolute w-100 h-100 bg-dark opacity-50"></div>
                <div class="position-relative h-100 d-flex align-items-center justify-content-center text-white p-5">
                    <div class="text-center">
                        <h1 class="display-3 fw-bold mb-3 ls-2">Gestión de Playa</h1>
                        <p class="fs-3 fw-light">Sistema integral de alquileres</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 bg-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="w-75">
                    <div class="text-center mb-4">
                        <img src="/img/logo.png" alt="Logo" class="img-fluid mb-3" style="max-height: 80px;">
                        <h3 class="mb-1">Bienvenido</h3>
                        <p class="text-muted">Ingresa tus credenciales</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Sesión cerrada correctamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required
                                    autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                            <a href="/" class="btn btn-outline-secondary">Volver al Inicio</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
