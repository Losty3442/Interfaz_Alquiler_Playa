<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Reportes - Admin')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: header}"></nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="fa-solid fa-chart-line"></i> Reporte de Ingresos</h2>
        <div th:replace="~{fragments/layout :: admin-nav}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/admin/reportes/generar}" method="post" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Fecha Inicio</label>
                        <input type="date" class="form-control" name="fechaInicio" th:value="${fechaInicio}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha Fin</label>
                        <input type="date" class="form-control" name="fechaFin" th:value="${fechaFin}" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-play"></i> Generar
                            Reporte</button>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${reporteGenerado}" class="card shadow border-success">
            <div class="card-header bg-success text-white">Resultados</div>
            <div class="card-body text-center">
                <div class="row">
                    <div class="col-md-6">
                        <h4>Alquileres Totales</h4>
                        <p class="display-4" th:text="${cantidad}">0</p>
                    </div>
                    <div class="col-md-6">
                        <h4>Ingresos Generados</h4>
                        <p class="display-4 text-success fw-bold" th:text="'S/ ' + ${total}">S/ 0.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
