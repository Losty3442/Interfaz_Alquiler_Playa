<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Dashboard - Alquiler Playa')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: header}"></nav>

    <div class="container py-5">
        <h2 class="mb-4">Panel de Administración</h2>

        <!-- Admin Nav -->
        <div th:replace="~{fragments/layout :: admin-nav}"></div>

        <!-- Cards de Métricas -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card text-white bg-primary h-100">
                    <div class="card-body">
                        <h5 class="card-title">En Curso</h5>
                        <p class="card-text display-4" th:text="${enCurso}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success h-100">
                    <div class="card-body">
                        <h5 class="card-title">Finalizados</h5>
                        <p class="card-text display-4" th:text="${finalizados}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info h-100">
                    <div class="card-body">
                        <h5 class="card-title">Recursos Libres</h5>
                        <p class="card-text display-4" th:text="${disponibles}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body">
                        <h5 class="card-title">Ganancias (30d)</h5>
                        <p class="card-text display-5" th:text="'S/ ' + ${ganancias}">S/ 0.00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Tendencia de Alquileres (Últimos 6 meses)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="trendsChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Estado de Recursos</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla: Últimos Alquileres -->
        <div class="card shadow-sm mt-4 mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Últimos Alquileres</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Estado</th>
                                <th>Vendedor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${ultimosAlquileres}">
                                <td th:text="${a.alquilerId}">#</td>
                                <td th:text="${a.fecha}">Fecha</td>
                                <td th:text="${a.horaInicio}">Hora</td>
                                <td>
                                    <span th:if="${a.estadoAlquiler == 'En Curso'}" class="badge bg-primary">En
                                        Curso</span>
                                    <span th:if="${a.estadoAlquiler == 'Finalizado'}"
                                        class="badge bg-success">Finalizado</span>
                                    <span
                                        th:unless="${a.estadoAlquiler == 'En Curso' or a.estadoAlquiler == 'Finalizado'}"
                                        class="badge bg-secondary" th:text="${a.estadoAlquiler}">Otro</span>
                                </td>
                                <td>
                                    <span th:if="${a.nombreVendedor != null}" th:text="${a.nombreVendedor}"
                                        class="fw-bold">Nome</span>
                                    <span th:unless="${a.nombreVendedor != null}"
                                        class="text-muted fst-italic">Desconocido</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ultimosAlquileres)}">
                                <td colspan="5" class="text-center text-muted py-3">No hay alquileres recientes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        // Datos Tendencias
        const trendsLabels = /*[[${tendenciasLabels}]]*/[];
        const trendsData = /*[[${tendenciasData}]]*/[];

        new Chart(document.getElementById('trendsChart'), {
            type: 'bar',
            data: {
                labels: trendsLabels,
                datasets: [{
                    label: '# Alquileres',
                    data: trendsData,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });

        // Datos Pie Chart
        const statusLabels = /*[[${estadosLabels}]]*/['Disponible', 'Mantenimiento', 'Alquilado'];
        const statusData = /*[[${estadosData}]]*/[10, 2, 5];

        new Chart(document.getElementById('statusChart'), {
            type: 'pie',
            data: {
                labels: statusLabels,
                datasets: [{
                    data: statusData,
                    backgroundColor: [
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(255, 206, 86, 0.6)'
                    ]
                }]
            }
        });
    </script>
</body>

</html>
